name: Take website offline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare an offline page without website content or photos
        run: |
          mkdir offline-site
          cat > offline-site/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website offline</title><body><p>This website is offline.</p></body></html>
          HTML
          cp offline-site/index.html offline-site/404.html
          touch offline-site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: offline-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Unpublish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}

          def status(method):
              request = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code

          deleted = status('DELETE')
          if deleted not in (204, 404):
              raise SystemExit(f'Offline page deployed, but unpublishing failed (HTTP {deleted}).')
          checked = status('GET')
          if checked != 404:
              raise SystemExit(f'Could not confirm unpublishing (HTTP {checked}).')
          print('GitHub Pages is unpublished; the public website is disabled.')
          PY
